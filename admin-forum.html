.forum-admin{max-width:1150px;margin:0 auto;padding:22px}.forum-admin h1{font:700 35px "Playfair Display",serif;color:#fff5de}.forum-admin>p{color:#e2e9de;font-size:13px}

.forum-admin-actions a{font-size:12px;color:#396545}
.forum-admin-actions button{background:#793f3b;color:#fff4ed;border:1px solid #bc7974;border-radius:8px;padding:10px 14px;cursor:pointer;font:700 12px "DM Sans",sans-serif}
